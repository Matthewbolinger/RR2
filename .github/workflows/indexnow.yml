name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/data.mjs"
      - "src/resources.mjs"
      - "src/templates.mjs"
      - "src/pages.mjs"
      - "src/case-studies.mjs"
      - "src/case-study-templates.mjs"
      - "src/legacy-routes.mjs"
      - "src/search-config.mjs"
      - "scripts/build.mjs"
      - "scripts/submit-indexnow.mjs"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build canonical URL inventory
        run: npm run build

      - name: Notify participating search engines
        run: npm run seo:indexnow:submit
