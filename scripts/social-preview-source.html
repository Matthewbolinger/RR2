<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raccoon Restoration social preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #080808;
    }

    body {
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .canvas {
      position: relative;
      display: grid;
      width: 1200px;
      height: 630px;
      padding: 58px 68px 48px;
      background:
        linear-gradient(90deg, rgba(3, 3, 3, 0.99) 0%, rgba(3, 3, 3, 0.94) 42%, rgba(3, 3, 3, 0.28) 76%, rgba(3, 3, 3, 0.05) 100%),
        linear-gradient(0deg, rgba(3, 3, 3, 0.88) 0%, rgba(3, 3, 3, 0) 36%),
        url("../public/assets/social-preview-backdrop-v1.png") center / cover no-repeat;
      border: 1px solid rgba(202, 162, 74, 0.48);
      isolation: isolate;
    }

    .canvas::before {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      content: "";
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      max-width: 670px;
    }

    .logo {
      width: 400px;
      height: auto;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.52));
    }

    .eyebrow {
      margin: 48px 0 12px;
      color: #d2aa4d;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.22em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 92px;
      font-weight: 400;
      letter-spacing: 0.012em;
      line-height: 0.92;
      text-transform: uppercase;
      text-shadow: 0 8px 34px rgba(0, 0, 0, 0.7);
    }

    h1 span {
      display: block;
      margin-top: 12px;
      color: #d2aa4d;
    }

    .market {
      position: absolute;
      right: 69px;
      bottom: 50px;
      z-index: 1;
      max-width: 410px;
      padding-top: 16px;
      border-top: 2px solid #d2aa4d;
      color: rgba(255, 255, 255, 0.86);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.55;
      text-align: right;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="content">
      <img
        class="logo"
        src="../public/assets/raccoon-restoration-logo-horizontal-web-480.png"
        alt="Raccoon Restoration"
      >
      <p class="eyebrow">Greater Chicago Roofing &amp; Restoration</p>
      <h1>Built Above<span>Standard.</span></h1>
    </section>
    <p class="market">Headquartered in Barrington, Illinois<br>Serving Greater Chicago</p>
  </main>
</body>
</html>
